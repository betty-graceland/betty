[project]
name = "betty-etl"
version = "0.1.0"
description = "Betty ingestion pipeline: extract, chunk, embed, write to OpenBrain"
requires-python = "==3.12.*"
authors = [{ name = "Betty Graceland", email = "betty@benesthemenace.com" }]

dependencies = [
    # Database
    "psycopg[binary]==3.2.3",
    "pgvector==0.3.6",

    # PDF extraction
    "pypdf==5.1.0",

    # Embedding model
    "sentence-transformers==3.3.1",
    "torch==2.5.1",
    "einops==0.8.0",

    # Utilities
    "python-dotenv==1.0.1",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["betty_etl"]
